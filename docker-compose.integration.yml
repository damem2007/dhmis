services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: dhmis_integration
      POSTGRES_USER: dhmis_integration
      POSTGRES_PASSWORD: dhmis_integration
    ports:
      - "127.0.0.1:54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dhmis_integration -d dhmis_integration"]
      interval: 2s
      timeout: 3s
      retries: 30
    # The integration database is disposable. Do not attach a production or
    # developer-data volume to this service.
    tmpfs:
      - /var/lib/postgresql/data
